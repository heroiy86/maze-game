<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>めいろゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>めいろゲーム</h1>
    <p class="game-description">😀があなただよ！★のゴールをめざしてね。ボタンをおすか、ゆびでなぞってすすもう！</p>
    <div id="game-container">
        <canvas id="maze-canvas"></canvas>
        <div id="win-message" class="hidden">
            <p>クリア！おめでとう！</p>
            <button id="new-game-button">あたらしいめいろ</button>
        </div>
    </div>
    <div id="controls">
            <button id="up-button" class="control-button">⬆️</button>
            <div class="horizontal-buttons">
                <button id="left-button" class="control-button">⬅️</button>
                <button id="down-button" class="control-button">⬇️</button>
                <button id="right-button" class="control-button">➡️</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
